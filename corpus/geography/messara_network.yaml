# Archaeological Regional Network of South-Central Crete (Messara Plain & Coast)
# Period: Middle Minoan II - Late Minoan I (c. 1800-1500 BC)
# Origin Point: Phaistos Palace (Lat 35.0514° N, Lon 24.8142° E, Elev 95m)
# Sources: UNESCO Serial Nomination Dossier (Minoan Palaces), Watrous (2004), Shaw (2006)

metadata:
  region: "Messara Plain & Western Asterousia, South-Central Crete"
  hub_site: "Phaistos Palace"
  period: "Middle Minoan III - Late Minoan I"
  description: "Settlement, harbor, cemetery, and peak/cave sanctuary network centered on the palatial hill of Phaistos."

sites:
