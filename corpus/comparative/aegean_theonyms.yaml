# Attested Bronze Age Aegean Theonyms & Religious Titles
# Sources:
# - Linear A: GORILA (Godart & Olivier 1976-1985), Younger (2000) Linear A texts
# - Linear B: Ventris & Chadwick (1973) Documents in Mycenaean Greek, Knossos tablets (KN V 52, KN Fp 1, KN Gg 705)

theonyms:
  - id: "TH_01"
    name: "JA-SA-SA-RA-ME"
    script: "Linear A"
    attested_forms: ["JA-SA-SA-RA-ME", "A-SA-SA-RA-ME"]
    syllable_count: 5
    skeleton: "A-B-B-C-D"
    has_geminate: true
    case: "Dative / Dedicated Title"
    interpretation: "Great Minoan Mother Goddess / 'Our Lady' (cf. Luwian ashasara / Semitic Asherah)"
    epigraphic_findspots: ["Psychro Cave (PS Za 2)", "Mount Juktas (IO Za 2)", "Palaikastro (PK Za 11)"]

