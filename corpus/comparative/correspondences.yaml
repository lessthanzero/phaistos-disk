# Proposed correspondences between Phaistos Disc and Linear A / B signs in scholarly literature
# Strict Chain of Inference tracking:
# L0: Native Phaistos Disc sign observation
# L1: Visual / formal resemblance to Linear A or Cretan Hieroglyphic sign
# L2: Linear B phonetic value projection (assumes Linear A sign has identical phonetic value to Linear B)
# L3: Linguistic translation hypothesis (assumes phonetic value spells out words in an ancient language)

