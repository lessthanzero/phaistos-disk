hypotheses:
  - id: "H001"
    type: "structural"
    title: "Rhyming refrain / strophic verse structure"
    description: "The recurring sign groups (A16, A19, A22 = 02-12-31-26 and A14, A20 = 02-27-25-10-23-18) represent a poetic refrain or ritual repetition."
    status: "untested"
    falsification_criteria: "If randomized corpora with identical word-length and vocabulary distributions produce equivalent or higher clustering of repeated sequences."

  - id: "H002"
    type: "epigraphic_phonetic"
    title: "Linear A CV-syllabary correspondence"
    description: "Signs matching Linear A pictograms (e.g. 02 Plumed Head, 12 Shield, 38 Rosette) share phonetic syllabic values with Linear A/B."
    status: "untested"
    falsification_criteria: "Cross-entropy with proposed Bronze Age Mediterranean phonotactics must significantly exceed random correspondence mappings."

  - id: "H003"
    type: "non_linguistic"
    title: "Lunisolar calendar / agricultural cycle"
    description: "The 61 groups and 242 signs represent days, lunar months, or intercalary festival periods rather than spoken language."
    status: "tested_supported_weak"
    falsification_criteria: "Group length distribution and sign repetitions must match astronomical periods without arbitrary ad-hoc sign weighting."

  # Speculative Geospatial / Radial Topology Hypothesis Family
  - id: "GEO-01"
    type: "speculative_geospatial"
    title: "Radial spatial coordinate map"
    description: "The Archimedean spiral encodes polar coordinates (radius r = distance from Phaistos, angle theta = compass bearing) to regional Messara landmarks."
    status: "untested"
    falsification_criteria: "Angular sectors on the physical disc must exhibit non-random clustering of sign types corresponding to geographic bearings (e.g. Mt. Ida North, Kommos West)."

  - id: "GEO-02"
    type: "speculative_geospatial"
    title: "Centre + radiating hinterland administrative zones"
    description: "The spiral compartments represent successive concentric tiers of territorial control radiating outward from the Phaistos palace."
    status: "untested"
    falsification_criteria: "Sign complexity and group length must correlate with radial distance from the disc center."

  - id: "GEO-03"
    type: "speculative_geospatial"
    title: "Processional route / itinerary sequence"
    description: "The 61 groups encode a sequential travel itinerary or ceremonial procession connecting coastal, valley, and mountain stations."
    status: "untested"
    falsification_criteria: "Transition network topology must match the planar graph properties of the Messara road network rather than an unconstrained linguistic Markov chain."

  - id: "GEO-04"
    type: "speculative_geospatial"
    title: "Territorial perimeter circuit"
    description: "The spiral trace represents a circumambulation of the Messara plain boundaries, listing boundary stones or border sanctuaries."
    status: "untested"
    falsification_criteria: "Loop closure and recurring refrains must map to circuitous return points in physical space."

  - id: "GEO-05"
    type: "speculative_geospatial"
    title: "Settlement network graph isomorphism"
    description: "The sign co-occurrence graph exhibits topological graph isomorphism with the hub-and-spoke settlement network of South-Central Crete."
    status: "untested"
    falsification_criteria: "Network degree centrality and spectral graph distance must beat randomized spatial graph baselines."

  - id: "GEO-06"
    type: "speculative_geospatial"
    title: "Ritual landscape between peak and cave sanctuaries"
    description: "The groups enumerate sacred stations between Kamares Cave, Mt. Ida, Kophinas, and palace courts."
    status: "untested"
    falsification_criteria: "Sign repetition frequencies must align with the hierarchical prominence of Minoan sacred sites."

  - id: "GEO-07"
    type: "speculative_geospatial"
    title: "Cosmological / sacred orientation diagram"
    description: "The radial layout aligns cardinal directions with astronomical horizon events (solstices, lunar standstills) over visible mountain peaks."
    status: "untested"
    falsification_criteria: "Cardinal ray alignment must correlate with archaeological sightlines measured from Phaistos Central Court."

  - id: "GEO-08"
    type: "speculative_geospatial"
    title: "Astronomical / geographical hybrid horizon calendar"
    description: "Combines a regional landmark itinerary with seasonal agricultural/astronomical cycles."
    status: "untested"
    falsification_criteria: "Information entropy and group lengths must simultaneously satisfy spatial and temporal periodicity constraints without free parameters."

