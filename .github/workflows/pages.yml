name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Build pages-safe workbench
        run: |
          mkdir -p site/workbench site/media
          cp docs/index.html docs/.nojekyll site/ 2>/dev/null || true
          # CC BY-SA Commons facsimiles + ATTRIBUTION (relative URLs from workbench/)
          cp -R docs/media/. site/media/
          uv run phaistos workbench --output site/workbench/index.html --pages-safe --no-open-browser
          test -f site/media/facsimiles/side_a.jpg
          test -f site/media/facsimiles/side_b.jpg
          test -f site/media/hagia_triada/crop_libation_hydria.webp
          test -f site/media/hagia_triada/crop_boat_model.webp
          grep -q '../media/facsimiles/side_a.jpg' site/workbench/index.html
          grep -q '../media/hagia_triada/crop_libation_hydria.webp' site/workbench/index.html
          grep -q 'facsimileCredit' site/workbench/index.html
          grep -q 'ArchaiOptix' site/workbench/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
